.brand-t{font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--blue-d)}
.brand-s{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{padding:10px 16px;border-radius:22px;color:var(--blue-d);text-decoration:none;font-size:14px;background:var(--blue-l);border:1px solid transparent}nav.tabs a:hover{border-color:var(--blue)}
nav.tabs a.on{background:var(--blue);color:#fff;font-weight:600}
.src{font-size:12px;color:var(--muted);text-align:right;display:flex;align-items:center;gap:10px}
.src button{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--blue);background:#fff;color:var(--blue-d);cursor:pointer}

main{max-width:1360px;margin:0 auto;padding:22px 28px 48px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.ct{margin:0 0 4px;font-size:16px;font-weight:600}
.cs{margin:0 0 14px;font-size:13px;color:var(--muted)}
.note{margin:12px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(440px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:15px;font-weight:500}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.kpi.b{border-color:var(--blue)}.kpi.o{border-color:var(--orange)}.kpi.r{border-color:var(--red)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.fg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fl{font-size:13px;color:var(--muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid #d6d5d0;background:var(--card);font-size:13px;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip:disabled{color:var(--faint);border-style:dashed;cursor:not-allowed}
.chip .sw{width:16px;height:3px;border-radius:2px}
select,input[type=search],input[type=password]{min-height:40px;border-radius:8px;border:1px solid #d6d5d0;padding:0 12px;font:inherit;font-size:14px;background:var(--card);color:var(--ink);min-width:0}
.btn{min-height:40px;padding:0 20px;border-radius:20px;border:0;background:var(--navy);color:#fcfcfb;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--navy);border:1px solid var(--navy);font-weight:500}

/* bars */
.hb{display:grid;grid-template-columns:minmax(100px,38%) minmax(40px,1fr) 52px 84px;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
.hb.n3{grid-template-columns:minmax(120px,44%) 1fr 64px}
.track{height:14px;border-radius:0 4px 4px 0;background:var(--line2)}
.fill{height:14px;border-radius:0 4px 4px 0}
.num{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.mut{color:var(--muted)}
.stack{display:flex;gap:2px;height:26px;min-width:0}
.stack>div{min-width:0;display:flex;align-items:center;padding-left:8px;font-size:12px;overflow:hidden;white-space:nowrap}
.stack>div:first-child{border-radius:4px 0 0 4px}.stack>div:last-child{border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.vbars{display:grid;gap:12px;align-items:end;height:240px;border-bottom:1px solid #c9c8c2;padding:0 6px}
.vbar{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.vlab{display:grid;gap:12px;padding:6px 6px 0;font-size:12px;color:var(--muted);text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.tile{padding:10px;border-radius:8px;background:var(--soft)}
.tile .l{font-size:11px;color:var(--muted)}.tile .v{font-size:18px;font-weight:700}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;white-space:nowrap}

table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line2);color:var(--ink2)}
td.nw{white-space:nowrap}
tr.me td{background:var(--blue-l);font-weight:600}
.tbox{overflow-x:auto}
.linkish{background:none;border:0;padding:0;color:var(--blue-d);cursor:pointer;text-align:left;font-size:13px}
.linkish:hover{text-decoration:underline}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--muted);flex-wrap:wrap;gap:8px}
.svgc{width:100%;height:auto;max-height:320px;display:block}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}

/* login + loading */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login{width:100%;max-width:380px;text-align:center}
.login .logo{margin:0 auto 12px;height:40px}
.login form{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.err{color:var(--red);font-size:13px;min-height:18px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}

/* search suggestions */
.sugg{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:340px;overflow-y:auto}
.sugg .h{padding:8px 14px;background:var(--soft);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.sugg label{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line2);font-size:14px;min-height:44px;cursor:pointer}
.sugg label span.c{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.sugg input{width:18px;height:18px}

@media (max-width:640px){
  .logo{height:22px}
  header.top{padding:12px 16px}
  main{padding:16px}
  .g2,.g3{grid-template-columns:1fr}
  .hb{grid-template-columns:minmax(90px,40%) 1fr 54px}
  .hb>span:nth-child(4){display:none}
}

.err:empty{display:none}
header.top::before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50% 100%)}

/* หน้าเข้าสู่ระบบ */
.loginbox{width:100%;max-width:420px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(31,79,143,.12)}
.lb-top{background:var(--blue);color:#fff;padding:30px 28px 26px;border-bottom:5px solid var(--red)}
.lb-top h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.5px}
.lb-sub{opacity:.9;font-size:14px;margin-top:4px}
.lb-form{padding:26px 28px 28px;display:flex;flex-direction:column;gap:14px}
.lb-form label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
.lb-form input{width:100%;min-height:48px;border-radius:10px;font-size:16px}
.lb-form .btn{min-height:48px;border-radius:24px;font-size:16px}
.lb-ft{font-size:12px;color:var(--faint);text-align:center}

/* การ์ด/แถวที่กดได้ */
button.card{font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.kpi.click{position:relative;transition:border-color .15s,box-shadow .15s}

<script>
/* CLAIM NIM DASHBOARD — app.js
 * ดึงข้อมูลจาก Google Sheet ผ่าน Apps Script (ต้องใส่รหัสผ่านทีม)
 */
'use strict';

// ===== ตั้งค่า =====
var API_URL = 'https://script.google.com/macros/s/AKfycbyE4b9fx23mv28rNNMvN7HguzNtG6KEHt4-ej0cZH-9lgMrzzI-xLshD-ysf2Mto8kH/exec';

var MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
var YEAR_COLORS = { 2563: '#008300', 2564: '#e87ba4', 2565: '#6250d6', 2566: '#eda100', 2567: '#1baf7a', 2568: '#eb6834', 2569: '#2d65ad', 2570: '#7a5af8', 2571: '#008300' };
var C = { red: '#d03730', blue: '#2d65ad', blueD: '#1f4f8f', blueL: '#c4d5ec', orange: '#eb6834', aqua: '#1baf7a', yellow: '#eda100', violet: '#6250d6', gray: '#a3a29c' };
var DEC_LABEL = { '01': '01 เคลม มูลค่าตามเงื่อนไข', '02': '02 เคลมสินค้าทำประกัน', '03': '03 เคลมมูลค่าเกินเงื่อนไข', '04': '04 ไม่เคลม (ตัดจบบิล)', '05': '05 ยกเลิกไม่เคลม (นำจัดส่งปลายทาง)' };
var PENDING = { B00: 1, B01: 1, B02: 1, B03: 1 };

var S = {
  rows: [], revenue: {}, updated: '', years: [], maxDate: '',
  page: 'overview',
  overview: { year: 0, month: 'all' },
  claim: { year: 'all', month: 'all', bill: 'all', cust: 'all', damage: 'all', grpBill: 'all' },
  assess: { year: 'all', month: 'all', scope: 'all', region: 'all' },
  customer: { q: '', selected: [], picked: false, year: 'all', status: 'all', pageNo: 0, years: null, topYear: 'all', crSort: 'rate' },
  unit: { region: '', unit: '', section: 'all', year: 'all', status: 'all', pageNo: 0, years: null }
};

// ===== เครื่องมือทั่วไป =====
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmt(n) { return Math.round(n || 0).toLocaleString('en-US'); }
function fmt2(n) { return (n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function mil(n) { return ((n || 0) / 1e6).toFixed(2); }
function pct(a, b, d) { return b ? (a / b * 100).toFixed(d == null ? 1 : d) + '%' : '—'; }
function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
function num(v) { if (typeof v === 'number') return v; var n = Number(String(v || '').replace(/,/g, '')); return isNaN(n) ? 0 : n; }
// ชื่อลูกค้ามาตรฐาน: ตัดสาขา/สำนักงานใหญ่/เลขผู้เสียภาษี และรวมชื่อย่อ บจก./หจก./บมจ. กับชื่อเต็ม
function canonSender(raw) {
  var s = norm(raw);
  if (!s) return s;
  var type = 'other', m;
  s = s.replace(/จำกัด\s*\(\s*มหาชน\s*\)/g, 'จำกัด (มหาชน)');
  var pcl = /มหาชน/.test(s);
  if ((m = s.match(/^บมจ\.?\s*/))) { type = 'co'; pcl = true; s = s.slice(m[0].length); }
  else if ((m = s.match(/^(บจก\.?|บ\.จ\.ก\.?|บริษัทจำกัด|บริษัท)\s*/))) { type = 'co'; s = s.slice(m[0].length); }
  else if ((m = s.match(/^(หจก\.?|ห\.จ\.ก\.?|ห้างหุ้นส่วนจำกัด)\s*/))) { type = 'hjk'; s = s.slice(m[0].length); }
  var hasLtd = s.lastIndexOf('จำกัด');
  if (hasLtd >= 0 && type !== 'hjk') { s = s.slice(0, hasLtd); if (type === 'other') type = 'ltd'; }
  s = s.replace(/[\(\[]?\s*(เลข(ที่)?\s*(ประจำตัว)?\s*(ผู้)?เสียภาษี(อากร)?|เลขภาษี|tax\s*id).*$/i, '');
  s = s.replace(/[\(\[]?\s*สำนักงานใหญ่\s*[\)\]]?/g, ' ');
  s = s.replace(/\s*[\(\[]?\s*สาขา.*$/, '');
  s = s.replace(/\(\s*\d+\s*\)/g, ' ');
  // วงเล็บเปิดที่ไม่มีวงเล็บปิด
  var open = s.lastIndexOf('('), close = s.lastIndexOf(')');
  if (open > close) s = s.slice(0, open);
  s = norm(s).replace(/[\s.,\/:;\-–]+$/, '').replace(/^[\s.,\/:;\-–]+/, '');
  if (!s) return norm(raw);
  if (type === 'co') return 'บริษัท ' + s + ' จำกัด' + (pcl ? ' (มหาชน)' : '');
  if (type === 'ltd') return s + ' จำกัด' + (pcl ? ' (มหาชน)' : '');
  if (type === 'hjk') return 'ห้างหุ้นส่วนจำกัด ' + s;
  return s;
}

// กุญแจเทียบชื่อลูกค้าเครดิต: ไม่สนเว้นวรรค จุด ตัวพิมพ์ คำนำหน้า บริษัท/หจก. และ จำกัด/(มหาชน) ท้ายชื่อ
function creditKey(name) {
  return norm(name).replace(/^(บริษัท|ห้างหุ้นส่วนจำกัด)\s*/, '').replace(/\s*จำกัด(\s*\(มหาชน\))?$/, '').replace(/[\s.\-,()'"’]/g, '').toLowerCase();
}
function stripCode(s) { return norm(s).replace(/^\d+\s+/, ''); }
function code(s) { var m = norm(s).match(/^([A-Za-z]*\d+)/); return m ? m[1] : ''; }
function sum(rows, k) { var t = 0; for (var i = 0; i < rows.length; i++) t += rows[i][k]; return t; }
function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }
function store(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { } }
function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

function groupBy(rows, keyFn) {
  var m = new Map();
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], k = keyFn(r);
    if (k == null || k === '') continue;
    var g = m.get(k);
    if (!g) { g = { key: k, n: 0, v: 0, req: 0, ch: 0, comp: 0, emp: 0, sub: 0, dp: 0, pend: 0, claimed: 0 }; m.set(k, g); }
    g.n++; g.v += r.conf; g.req += r.req; g.ch += r.charged; g.comp += r.shComp; g.emp += r.shEmp; g.sub += r.shSub; g.dp += r.shDp;
    if (r.pending) g.pend++; if (r.claimed) g.claimed++;
  }
  return Array.from(m.values());
}
function byN(a, b) { return b.n - a.n; }

// ===== เตรียมข้อมูล =====
function decCode(label) {
  var c = code(label);
  if (c) return c.slice(0, 2);
  var s = norm(label);
  if (!s) return '';
  if (s.indexOf('เกินเงื่อนไข') >= 0) return '03';
  if (s.indexOf('ประกัน') >= 0) return '02';
  if (s.indexOf('ยกเลิก') >= 0) return '05';
  if (s.indexOf('ไม่เคลม') >= 0) return '04';
  if (s.indexOf('เงื่อนไข') >= 0) return '01';
  return '';
}

function prepare(payload) {
  var f = payload.fields, idx = {};
  f.forEach(function (k, i) { idx[k] = i; });
  // แผ่นตั้งค่า: [ประเภท, ค่าเดิม, แปลงเป็น]
  var map = { unit: {}, sender: {}, group: {}, region: {} };
  (payload.settings || []).forEach(function (s) {
    var t = s[0];
    var key = /หน่วยงาน/.test(t) ? 'unit' : /ลูกค้า|ผู้ส่ง/.test(t) ? 'sender' : /กลุ่มสินค้า/.test(t) ? 'group' : /ภาค/.test(t) ? 'region' : null;
    if (key && s[2]) map[key][norm(s[1])] = norm(s[2]);
  });
  var dicts = payload.dicts || {};
  function g(row, k) {
    if (idx[k] == null) return '';
    var v = row[idx[k]];
    return dicts[k] ? dicts[k][v] : v;
  }
  function mapped(k, v) { v = norm(v); v = map[k][v] || v; var t = k === 'sender' ? canonSender(v) : stripCode(v); return map[k][t] || t; }
  var out = [], maxDate = '';
  payload.rows.forEach(function (row) {
    var d = norm(g(row, 'date')), m = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
    var y = m ? +m[1] : +g(row, 'sheet') || 0, mo = m ? +m[2] : 0, day = m ? +m[3] : 0;
    if (y && y < 2400) y += 543; // ปี ค.ศ. → พ.ศ.
    var ds = y && mo ? y + '-' + ('0' + mo).slice(-2) + '-' + ('0' + day).slice(-2) : '';
    if (ds > maxDate) maxDate = ds;
    var r = {
      date: ds, y: y, m: mo, d: day,
      damage: stripCode(g(row, 'damage')), bill: norm(g(row, 'bill')), custType: norm(g(row, 'custType')), billType: norm(g(row, 'billType')),
      sender: mapped('sender', g(row, 'sender')), senderRaw: norm(g(row, 'sender')), receiver: norm(g(row, 'receiver')) ? mapped('sender', g(row, 'receiver')) : '', group: mapped('group', g(row, 'group')), dest: stripCode(g(row, 'dest')),
      decision: norm(g(row, 'decision')), noClaim: stripCode(g(row, 'noClaim')),
      freight: num(g(row, 'freight')), req: num(g(row, 'req')), conf: num(g(row, 'conf')),
      spot: stripCode(g(row, 'spot')), unit: mapped('unit', g(row, 'unit')), region: mapped('region', g(row, 'region')), section: stripCode(g(row, 'section')),
      resp: stripCode(g(row, 'resp')), shComp: num(g(row, 'shComp')), shEmp: num(g(row, 'shEmp')), shSub: num(g(row, 'shSub')), shDp: num(g(row, 'shDp')),
      claimSt: norm(g(row, 'claimSt')), clearSt: norm(g(row, 'clearSt'))
    };
    if (/^0+$/.test(r.spot)) r.spot = '';
    r.dec = decCode(r.decision);
    r.decision = stripCode(DEC_LABEL[r.dec] || r.decision);
    r.claimed = r.dec === '01' || r.dec === '02' || r.dec === '03';
    r.clearCode = code(r.clearSt);
    r.claimCode = code(r.claimSt);
    r.pending = !!PENDING[r.clearCode];
    r.charged = r.shEmp + r.shSub + r.shDp;
    r.assessed = !!r.resp;
    out.push(r);
  });
  // ลูกค้าเครดิต: ยอดขายรายเดือน + หาเจ้าของบิลเครดิต (กรณีส่งกลับผู้ส่ง)
  var CR = { sales: {}, total: {}, names: {}, minYm: 0, maxYm: 0 };
  var cp = payload.credit;
  if (cp && cp.rows) {
    var cn = cp.names.map(function (n) { return mapped('sender', n); });
    cp.rows.forEach(function (x) {
      var k = cn[x[0]], ym = x[1] * 100 + x[2];
      var sk = CR.sales[k] || (CR.sales[k] = {}), e = sk[ym] || (sk[ym] = { b: 0, t: 0 });
      e.b += x[3]; e.t += x[4];
      var t = CR.total[ym] || (CR.total[ym] = { b: 0, t: 0 });
      t.b += x[3]; t.t += x[4];
      if (!CR.minYm || ym < CR.minYm) CR.minYm = ym;
      if (ym > CR.maxYm) CR.maxYm = ym;
      CR.names[k] = 1;
    });
  }
  CR.byKey = {};
  Object.keys(CR.names).forEach(function (n) { var k = creditKey(n); if (k && !CR.byKey[k]) CR.byKey[k] = n; });
  var minYm = 0, maxYm = 0;
  out.forEach(function (r) {
    r.ym = r.y * 100 + r.m;
    if (r.m) { if (!minYm || r.ym < minYm) minYm = r.ym; if (r.ym > maxYm) maxYm = r.ym; }
    if (r.custType !== 'เครดิต' || !CR.minYm) return;
    var sn = CR.names[r.sender] ? r.sender : CR.byKey[creditKey(r.sender)];
    if (sn) { r.sender = sn; r.creditCust = sn; return; }
    var rn = r.receiver ? (CR.names[r.receiver] ? r.receiver : CR.byKey[creditKey(r.receiver)]) : '';
    if (rn) { r.returned = true; r.shipper = r.sender; r.sender = rn; r.creditCust = rn; return; }
    r.creditUnmatched = true;
  });
  S.credit = CR.minYm ? CR : null;
  S.claimMinYm = minYm; S.claimMaxYm = maxYm;
  S.rows = out;
  S.maxDate = maxDate;
  S.years = uniq(out.map(function (r) { return r.y; }).filter(Boolean)).sort();
  S.revenue = payload.revenue || {};
  S.updated = payload.updated || '';
}


// ===== ลูกค้าเครดิต: อัตราเคลม =====
function nextYm(ym) { return ym % 100 === 12 ? ym + 89 : ym + 1; }
// เดือนที่มีทั้งข้อมูลเคลมและยอดขายเครดิต
function creditMonths(year) {
  var out = [];
  if (!S.credit) return out;
  var a = Math.max(S.claimMinYm, S.credit.minYm), b = Math.min(S.claimMaxYm, S.credit.maxYm);
  for (var ym = a; ym <= b; ym = nextYm(ym)) if (year === 'all' || Math.floor(ym / 100) === +year) out.push(ym);
  return out;
}
function monthsLabel(months) {
  if (!months.length) return '—';
  var f = months[0], l = months[months.length - 1];
  return MONTHS[f % 100 - 1] + ' ' + Math.floor(f / 100) + ' – ' + MONTHS[l % 100 - 1] + ' ' + Math.floor(l / 100);
}
// rows = เคสเครดิตของลูกค้า (หรือทั้งหมด), name = ชื่อลูกค้า หรือ null = ลูกค้าเครดิตทั้งหมด
function creditStat(rows, name, months) {
  var set = {}, n = 0, v = 0, b = 0, t = 0;
  months.forEach(function (m) { set[m] = 1; });
  rows.forEach(function (r) { if (set[r.ym]) { n++; v += r.conf; } });
  var src = name ? (S.credit.sales[name] || {}) : S.credit.total;
  months.forEach(function (m) { if (src[m]) { b += src[m].b; t += src[m].t; } });
  return { n: n, v: v, bills: b, baht: t, rate: t ? v / t * 100 : null, per: b ? n / b * 1000 : null };
}

function thaiDate(ds) {
  if (!ds) return '—';
  var p = ds.split('-');
  return (+p[2]) + ' ' + MONTHS[+p[1] - 1] + ' ' + p[0];
}

// ===== กราฟ =====
function niceMax(v) {
  if (v <= 0) return 1;
  var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  var s = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return s * p;
}

// series: [{name, color, data:[12 ค่า หรือ null]}]
function lineChart(series, opt) {
  opt = opt || {};
  var W = 640, H = 240, L = 52, R = 40, T = 16, B = 30;
  var all = [];
  series.forEach(function (s) { s.data.forEach(function (v) { if (v != null) all.push(v); }); });
  var max = niceMax(Math.max.apply(null, all.concat([0])) * 1.05);
  var x = function (i) { return L + i * ((W - L - R) / 11); };
  var y = function (v) { return H - B - v / max * (H - T - B); };
  var yf = opt.yFmt || fmt;
  var h = '<svg class="svgc" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opt.label || 'กราฟเส้น') + '">';
  for (var k = 0; k <= 4; k++) {
    var gv = max * k / 4;
    h += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(gv) + '" y2="' + y(gv) + '" stroke="' + (k ? '#efeee9' : '#c9c8c2') + '"/>';
    h += '<text x="' + (L - 8) + '" y="' + (y(gv) + 4) + '" font-size="11" fill="#5f5e5a" text-anchor="end">' + esc(yf(gv)) + '</text>';
  }
  MONTHS.forEach(function (m, i) { h += '<text x="' + x(i) + '" y="' + (H - 10) + '" font-size="11" fill="#5f5e5a" text-anchor="middle">' + m + '</text>'; });
  series.forEach(function (s) {
    var segs = [], cur = [];
    s.data.forEach(function (v, i) { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push(x(i) + ',' + y(v)); });
    if (cur.length) segs.push(cur);
    segs.forEach(function (sg) { h += '<polyline points="' + sg.join(' ') + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round"/>'; });
    var last = -1;
    s.data.forEach(function (v, i) {
      if (v == null) return; last = i;
      h += '<circle ' + (opt.pointAttr ? opt.pointAttr(i) + ' ' : '') + 'cx="' + x(i) + '" cy="' + y(v) + '" r="' + (opt.pointAttr ? 6 : 4) + '" fill="' + s.color + '" stroke="#fcfcfb" stroke-width="2"><title>' + esc(MONTHS[i] + ' ' + s.name + ' · ' + (opt.tipFmt || yf)(v)) + '</title></circle>';
    });

  if (unmatched.length) {

    S.years.map(function (y) {

'use strict';

function deltaTag(cur, prev, upIsBad, isPct) {
  if (prev == null || cur == null || (!isPct && !prev)) return '<span class="mut">ไม่มีข้อมูลปีก่อน</span>';
  var d = isPct ? cur - prev : (cur - prev) / prev * 100;
  if (Math.abs(d) < (isPct ? 0.005 : 0.5)) return '<span class="mut">เท่ากับปีก่อน</span>';
  var up = d > 0, bad = upIsBad ? up : !up;
  var txt = (up ? '▲ ' : '▼ ') + (isPct ? Math.abs(d).toFixed(2) + ' จุด' : Math.abs(d).toFixed(0) + '%');
  return '<span style="font-weight:600;color:' + (bad ? '#a8231d' : '#1f4f8f') + '">' + txt + '</span> <span class="mut">เทียบปีก่อน</span>';
}

    .filter(function (s) { return s.data.some(function (v) { return v != null; }); });

    (st.month !== 'all' ? '<button class="btn ghost" data-set="overview.month" data-val="all" style="min-height:36px">ดูทั้งปี</button>' : '') + '</div>';

  // สรุปสั้นจากเมนูอื่น
  var topC = groupBy(cur, function (r) { return r.sender; }).sort(byN).slice(0, 5);
  var topU = groupBy(cur.filter(function (r) { return r.unit; }), function (r) { return r.unit; }).sort(byN).slice(0, 5);

    secRows.map(function (g) { var p = g.v ? Math.min(100, g.ch / g.v * 100) : 0; return '<tr><td>' + esc(g.key) + '</td><td class="num">' + fmt(g.n) + '</td><td class="num">' + fmt(g.v) + '</td><td class="num">' + fmt(g.ch) + '</td><td><div style="display:flex;align-items:center;gap:6px"><div style="flex:1;height:8px;background:#efeee9;border-radius:0 4px 4px 0"><div style="height:8px;width:' + p + '%;background:' + C.orange + ';border-radius:0 4px 4px 0"></div></div><span class="num" style="width:40px">' + pct(g.ch, g.v, 0) + '</span></div></td><td class="num" style="color:#d03730">' + fmt(g.pend) + '</td></tr>'; }).join('') +

  var pendSec = groupBy(pend, function (r) { return r.section; }).sort(byN);
  var oldest = pend.map(function (r) { return r.date; }).filter(Boolean).sort()[0];
  h += '<section class="grid g2"><div class="card"><h2 class="ct">อันดับหน่วยงาน (' + rankYears.join('–') + ')</h2><p class="cs">10 อันดับแรกจาก ' + rk.length + ' หน่วยงาน · เรียงตามจำนวนเคส</p><div class="tbox"><table><thead><tr><th>#</th><th>หน่วยงาน</th><th style="text-align:right">เคส</th><th style="text-align:right">มูลค่า (บาท)</th><th style="text-align:right">เฉลี่ย/เคส</th><th style="text-align:right">% เรียกเก็บ</th></tr></thead><tbody>' +
    top10.map(function (o) { var g = o.g; return '<tr' + (g.key === st.unit ? ' class="me"' : '') + '><td class="mut">' + (o.i + 1) + '</td><td><button class="linkish" data-go="unit" data-val="' + esc(g.key) + '">' + esc(g.key) + '</button></td><td class="num">' + fmt(g.n) + '</td><td class="num">' + fmt(g.v) + '</td><td class="num">' + fmt(g.v / g.n) + '</td><td class="num">' + pct(g.ch, g.v) + '</td></tr>'; }).join('') +
    '</tbody></table></div></div>' +
    '<div class="card" style="border-color:#d03730"><h2 class="ct">เคสค้างเคลียร์</h2><p class="cs">' + fmt(pend.length) + ' เคส · ' + mil(sum(pend, 'conf')) + ' ล้านบาท' + (oldest ? ' · เก่าสุดตั้งแต่ ' + thaiDate(oldest) : '') + '</p>' +
    (pendBy.length ? '<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">' + pendBy.map(function (g) { return '<div style="padding:14px;border-radius:10px;background:#fbe9e8"><div style="font-size:12px;color:#a8231d">' + esc(g.key) + '</div><div style="font-size:24px;font-weight:700">' + fmt(g.n) + '</div><div class="mut" style="font-size:12px">' + fmt(g.v) + ' บาท</div></div>'; }).join('') + '</div>' +
      '<div style="margin-top:14px;font-size:13px">ค้างตามส่วนงาน: ' + pendSec.map(function (g) { return esc(g.key.replace(/^\d+\s*/, '')) + ' ' + fmt(g.n); }).join(' · ') + '</div>' : '<div class="empty">ไม่มีเคสค้างเคลียร์</div>') + '</div></section>';

  var hist = rows.filter(function (r) { return st.status === 'pend' ? r.pending : st.status === 'ch' ? r.charged > 0 : true; });
  h += '<section class="card"><div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px"><div><h2 class="ct">ประวัติเคสรายบิล</h2><p class="cs" style="margin:0">เรียงจากล่าสุด</p></div><div class="fg">' +
    chips('unit.status', [['all', 'ทั้งหมด ' + fmt(n)], ['pend', 'ค้างเคลียร์ ' + fmt(pend.length)], ['ch', 'มียอดเรียกเก็บ ' + fmt(rows.filter(function (r) { return r.charged > 0; }).length)]], st.status) +
    '<button class="btn ghost" data-act="csvUnit" style="min-height:36px">ดาวน์โหลด CSV (Excel)</button></div></div>' +
    historyTable(hist, 'unit', [
      { h: 'วันที่เอกสาร', f: function (r) { return thaiDate(r.date); } },
      { h: 'เลขที่บิล', f: function (r) { return esc(r.bill); } },
      { h: 'ประเภทความเสียหาย', f: function (r) { return esc(r.damage); } },
      { h: 'ส่วนงาน', f: function (r) { return esc(r.section.replace(/^\d+\s*/, '')); } },
      { h: 'จุดที่เกิดเหตุ', f: function (r) { return esc(r.spot.replace(/^\d+\s*/, '')); } },
      { h: 'ผู้รับผิดชอบ', f: function (r) { return esc(r.resp.replace(/^\d+\s*/, '')); } },
      { h: 'มูลค่า', num: 1, f: function (r) { return fmt2(r.conf); } },
      { h: 'เรียกเก็บ', num: 1, f: function (r) { return r.charged ? '<b>' + fmt2(r.charged) + '</b>' : '—'; } },
      { h: 'สถานะเคลียร์', f: statusTag }
    ]) + '</section>';
  return h;
}

// ============ การทำงานของหน้าเว็บ ============

// ============ ลูกค้า: ภาพรวมก่อนค้นหา ============
function customerOverview() {
  var st = S.customer;
  var rows = st.topYear === 'all' ? S.rows : S.rows.filter(function (r) { return r.y === +st.topYear; });
  S.ctx = rows;
  var senders = groupBy(rows, function (r) { return r.sender; }).sort(byN).slice(0, 10);
  var h = '<section class="filters"><div class="fg"><span class="fl">ปี</span>' + yearChips('customer.topYear', st.topYear) + '</div></section>';
  h += '<section class="card"><h2 class="ct">Top 10 ลูกค้าที่แจ้งเคลม</h2><p class="cs">' + periodText(st.topYear) + ' · กดชื่อเพื่อดูโปรไฟล์ลูกค้า</p><div class="tbox"><table><thead><tr><th>#</th><th>ลูกค้า</th><th>ประเภท</th><th style="text-align:right">เคส</th><th style="text-align:right">มูลค่ายืนยัน (บาท)</th></tr></thead><tbody>' +
    senders.map(function (g, i) {
      var cr = rows.filter(function (r) { return r.sender === g.key && r.custType === 'เครดิต'; }).length >= g.n / 2;
      return '<tr><td class="mut">' + (i + 1) + '</td><td><button class="linkish" data-go="customer" data-val="' + esc(g.key) + '">' + esc(g.key) + '</button></td><td><span class="tag" style="background:' + (cr ? '#e8eff8;color:#1f4f8f' : '#efeee9;color:#52514e') + '">' + (cr ? 'เครดิต' : 'เงินสด') + '</span></td><td class="num">' + fmt(g.n) + '</td><td class="num">' + fmt(g.v) + '</td></tr>';
    }).join('') + '</tbody></table></div></section>';
  return h + creditSection(S.rows, st);
}

// ============ หน้าต่างรายการบิล ============
var MODAL_PER = 20;
function openModal(title, rows) {
  S.modal = { title: title, rows: rows.slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }), page: 0 };
  renderModal();
}
function modalAction(a) {
  if (!S.modal) return;
  if (a === 'close') { S.modal = null; renderModal(); return; }
  if (a === 'prev') S.modal.page = Math.max(0, S.modal.page - 1);
  if (a === 'next') S.modal.page++;
  if (a === 'csv') { downloadCSV(S.modal.rows, 'claim_' + S.modal.title.replace(/[^฀-๿a-zA-Z0-9]+/g, '_').slice(0, 40)); return; }
  renderModal();
}
function renderModal() {
  var box = $('modal');
  if (!S.modal) { box.classList.add('hidden'); box.innerHTML = ''; document.body.style.overflow = ''; return; }
  var md = S.modal, rows = md.rows, pages = Math.max(1, Math.ceil(rows.length / MODAL_PER));
  if (md.page >= pages) md.page = pages - 1;
  var part = rows.slice(md.page * MODAL_PER, md.page * MODAL_PER + MODAL_PER);
  box.innerHTML = '<div class="box" role="dialog" aria-modal="true" aria-label="' + esc(md.title) + '"><div class="mh"><div><div class="mut" style="font-size:12px">รายการบิล · ' + esc(periodHint()) + '</div><h2 style="margin:2px 0 4px;font-size:18px">' + esc(md.title) + '</h2>' +
    '<div class="mut" style="font-size:13px">' + fmt(rows.length) + ' เคส · ยื่น ' + fmt(sum(rows, 'req')) + ' บาท · ยืนยัน ' + fmt(sum(rows, 'conf')) + ' บาท</div></div>' +
    '<div class="fg"><button class="btn ghost" data-modal="csv" style="min-height:40px">ดาวน์โหลด CSV (Excel)</button><button class="x" data-modal="close" aria-label="ปิด">×</button></div></div>' +
    '<div class="tbox"><table><thead><tr><th>วันที่เอกสาร</th><th>เลขที่บิล</th><th>ลูกค้า</th><th>ประเภทความเสียหาย</th><th>กลุ่มสินค้า</th><th>หน่วยงาน</th><th style="text-align:right">ยื่นเคลม</th><th style="text-align:right">ยืนยัน</th><th>สถานะ</th></tr></thead><tbody>' +
    (part.length ? part.map(function (r) {
      return '<tr><td class="nw">' + thaiDate(r.date) + '</td><td class="nw">' + esc(r.bill) + '</td><td>' + esc(r.sender) + (r.returned ? ' <span class="tag" style="background:#efeee9;color:#52514e">ส่งกลับ</span>' : '') + '</td><td>' + esc(r.damage) + '</td><td>' + esc(r.group || '—') + '</td><td>' + esc(r.unit || '—') + '</td>' +
        '<td class="num nw">' + fmt2(r.req) + '</td><td class="num nw" style="font-weight:600">' + (r.conf ? fmt2(r.conf) : '—') + '</td><td class="nw">' + statusTag(r) + '</td></tr>';
    }).join('') : '<tr><td colspan="9" class="empty">ไม่มีเคส</td></tr>') + '</tbody></table></div>' +
    '<div class="pager"><span>หน้า ' + (md.page + 1) + ' จาก ' + pages + '</span><div class="fg"><button class="chip" data-modal="prev"' + (md.page ? '' : ' disabled') + '>ก่อนหน้า</button><button class="chip" data-modal="next"' + (md.page < pages - 1 ? '' : ' disabled') + '>ถัดไป</button></div></div></div>';
  box.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function periodHint() {
  var p = S.page;
  if (p === 'overview') return S.overview.month !== 'all' ? MONTHS[+S.overview.month - 1] + ' ' + S.overview.year : 'ปี ' + S.overview.year;
  if (p === 'claim' || p === 'assess') return periodLabel(S[p]);
  if (p === 'customer') return S.customer.picked ? (S.customer.selected[0] || '') + ' · ' + periodText(S.customer.year) : periodText(S.customer.topYear);
  if (p === 'unit') return S.unit.unit + ' · ' + periodText(S.unit.year);
  return '';
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.modal) modalAction('close'); });
document.addEventListener('mousedown', function (e) { if (e.target.id === 'modal') modalAction('close'); });

function render() {
  var p = S.page;
  document.querySelectorAll('nav.tabs a').forEach(function (a) { a.classList.toggle('on', a.dataset.page === p); });
  S.ctx = [];
  var html = p === 'assess' ? renderAssess() : p === 'customer' ? renderCustomer() : p === 'unit' ? renderUnit() : p === 'claim' ? renderClaim() : renderOverview();
  $('view').innerHTML = html;
  $('srcInfo').textContent = 'ข้อมูลถึง ' + thaiDate(S.maxDate) + ' · โหลดเมื่อ ' + S.updated;
}

function route() {
  var p = (location.hash || '#overview').slice(1).split('?')[0];
  S.page = ['overview', 'claim', 'assess', 'customer', 'unit'].indexOf(p) >= 0 ? p : 'overview';
  render();
  window.scrollTo(0, 0);
}

function setVal(path, val) {
  var p = path.split('.'), o = S[p[0]];
  o[p[1]] = val;
  if (p[1] === 'year' && (val === 'all' || p[0] === 'overview')) { if (val === 'all') o.month = 'all'; }
  if (p[0] === 'unit' && p[1] === 'region') { o.unit = ''; var u = groupBy(S.rows.filter(function (r) { return r.region === val && r.unit; }), function (r) { return r.unit; }).sort(byN)[0]; o.unit = u ? u.key : ''; }
  if (p[0] === 'unit' && (p[1] === 'unit' || p[1] === 'region')) { o.section = 'all'; o.year = 'all'; o.years = null; }
  if (o.pageNo != null) o.pageNo = 0;
  render();
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-set],[data-toggle-year],[data-page-nav],[data-go],[data-act],[data-drill],[data-drill-field],[data-nav],[data-scroll],[data-modal]');
  if (!t || t.tagName === 'SELECT') return;
  if (t.dataset.modal) { modalAction(t.dataset.modal); return; }
  if (t.dataset.drill) { var d = DRILL[t.dataset.drill]; openModal(d.t, S.ctx.filter(d.f)); return; }
  if (t.dataset.drillField) {
    var fld = t.dataset.drillField, val = t.dataset.val;
    openModal((FIELD_LABEL[fld] || fld) + ': ' + val, S.ctx.filter(function (r) { return val === 'ยังไม่ระบุ' ? !r[fld] : r[fld] === val; }));
    return;
  }
  if (t.dataset.nav) {
    var src = S.overview, dst = S[t.dataset.nav];
    if (S.page === 'overview' && dst) { dst.year = src.year; dst.month = src.month; }
    location.hash = '#' + t.dataset.nav; return;
  }
  if (t.dataset.scroll) { var el = $(t.dataset.scroll); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (t.dataset.set) { setVal(t.dataset.set, t.dataset.val); return; }
  if (t.dataset.toggleYear) {
    var st = S[t.dataset.toggleYear], y = +t.dataset.val, i = st.years.indexOf(y);
    if (i >= 0) st.years.splice(i, 1); else st.years.push(y);
    render(); return;
  }
  if (t.dataset.pageNav) { S[t.dataset.pageNav].pageNo += +t.dataset.val; render(); return; }
  if (t.dataset.go === 'unit') {
    e.preventDefault();
    var u = t.dataset.val, rg = groupBy(S.rows.filter(function (r) { return r.unit === u; }), function (r) { return r.region; }).sort(byN)[0];
    Object.assign(S.unit, { unit: u, region: rg ? rg.key : '', section: 'all', year: 'all', status: 'all', pageNo: 0, years: null });
    if (location.hash === '#unit') render(); else location.hash = '#unit';
    return;
  }
  if (t.dataset.go === 'customer') {
    e.preventDefault();
    Object.assign(S.customer, { q: '', selected: [t.dataset.val], picked: true, year: 'all', status: 'all', pageNo: 0, years: null });
    if (location.hash === '#customer') render(); else location.hash = '#customer';
    return;
  }
  var act = t.dataset.act;
  if (act === 'custApply') { if (S.customer.selected.length) { S.customer.picked = true; S.customer.q = ''; Object.assign(S.customer, { year: 'all', status: 'all', pageNo: 0, years: null }); render(); } return; }
  if (act === 'custClear') { Object.assign(S.customer, { q: '', selected: [], picked: false }); render(); return; }
  if (act === 'csvCustomer') { downloadCSV(S.rows.filter(function (r) { return S.customer.selected.indexOf(r.sender) >= 0 && (S.customer.year === 'all' || r.y === +S.customer.year); }), 'claim_customer_' + S.customer.selected[0].slice(0, 30)); return; }
  if (act === 'csvUnit') { var su = S.unit; downloadCSV(S.rows.filter(function (r) { return r.unit === su.unit && (su.year === 'all' || r.y === +su.year) && (su.section === 'all' || r.section === su.section); }), 'claim_unit_' + su.unit); return; }
});

document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.set) { setVal(t.dataset.set, t.value); return; }
  if (t.dataset && t.dataset.pick != null) {
    var sel = S.customer.selected, k = t.dataset.pick, i = sel.indexOf(k);
    if (t.checked && i < 0) sel.push(k); if (!t.checked && i >= 0) sel.splice(i, 1);
    S.customer.picked = false;
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'custQ') { S.customer.q = e.target.value; $('custSugg').innerHTML = suggestionsHTML(); }
});
document.addEventListener('keydown', function (e) {
  if (e.target.id === 'custQ' && e.key === 'Enter') {
    var q = norm(S.customer.q).toLowerCase();
    if (q.length >= 2 && !S.customer.selected.length) {
      S.customer.selected = senderStats().filter(function (g) { return g.key.toLowerCase().indexOf(q) >= 0; }).slice(0, 30).map(function (g) { return g.key; });
      $('custSugg').innerHTML = suggestionsHTML();
    }
  }
});

// ===== เข้าสู่ระบบ / โหลดข้อมูล =====
function show(id) { ['login', 'loading', 'app'].forEach(function (k) { $(k).classList.toggle('hidden', k !== id); }); }

// ข้อมูลจาก Apps Script มาแบบบีบอัด (gzip + base64) แล้วคลายที่เบราว์เซอร์
function gunzipBase64(b64) {
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(stream).text().then(JSON.parse);
}

function fetchData(password) {
  show('loading');
  var canGunzip = typeof DecompressionStream !== 'undefined';
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ password: password, plain: !canGunzip }) })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data.ok) throw new Error(data.error || 'โหลดข้อมูลไม่สำเร็จ');
      return data.gz ? gunzipBase64(data.gz) : data;
    })
    .then(function (data) {
      if (!data.ok) throw new Error(data.error || 'โหลดข้อมูลไม่สำเร็จ');
      prepare(data);
      SENDER_STATS = null;
      store('nimClaimPw', password);
      show('app');
      route();
    })
    .catch(function (err) {
      store('nimClaimPw', null);
      show('login');
      $('loginErr').textContent = /รหัสผ่าน/.test(err.message) ? err.message :
        /load failed|failed to fetch|network/i.test(err.message) ? 'เชื่อมต่อ Google Sheet ไม่สำเร็จ (ตอบช้าเกินไปหรือเน็ตหลุด) กรุณาลองอีกครั้ง' :
        'โหลดข้อมูลไม่สำเร็จ: ' + err.message;
    });
}

$('loginForm').addEventListener('submit', function (e) { e.preventDefault(); $('loginErr').textContent = ''; fetchData($('pw').value); });
$('reload').addEventListener('click', function () { var pw = load('nimClaimPw'); if (pw) fetchData(pw); else show('login'); });
window.addEventListener('hashchange', function () { if (S.rows.length) route(); });
(function init() { var pw = load('nimClaimPw'); if (pw) fetchData(pw); })();

</script>
